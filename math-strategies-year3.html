<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a0a3e">
<meta name="format-detection" content="telephone=no">
<title>Math Strategies Adventure – Year 2 &amp; 3</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--c:#FF6B6B;--cw:clamp(40px,9vw,56px)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:Nunito,system-ui,-apple-system,sans-serif;color:#2C3E50;
  background:radial-gradient(ellipse at top,#3d1f7a 0%,#1a0a3e 60%,#0d0520 100%);background-attachment:fixed;
  min-height:100vh;padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));
  -webkit-tap-highlight-color:transparent}
button{font-family:inherit;touch-action:manipulation;-webkit-user-select:none;user-select:none}
#shell{max-width:1000px;margin:0 auto;background:linear-gradient(#FFF5F0,#FFEBDB);border-radius:18px;
  box-shadow:0 25px 80px rgba(0,0,0,.6);min-height:calc(100vh - 16px);overflow:hidden;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(255,255,255,.94);border-bottom:2px solid #FFE0E0;position:sticky;top:0;z-index:10}
.bar .back{width:46px;height:40px;border:0;border-radius:10px;background:#FF6B6B;color:#fff;font:20px 'Fredoka One',sans-serif;cursor:pointer;flex:none}
.bar .back.hide{visibility:hidden}
.bar h1{flex:1;text-align:center;font:clamp(17px,3.6vw,28px) 'Fredoka One',sans-serif;color:var(--c);line-height:1.1}
.bar .icon{width:44px;height:40px;border:0;border-radius:10px;background:#F3F4F6;font-size:19px;cursor:pointer;flex:none}
.bar .stars{font:18px 'Fredoka One',sans-serif;color:#F59E0B;text-align:right;line-height:1.1;min-width:64px}
.bar .stars small{display:block;font:800 13px Nunito,sans-serif;color:#EF4444}
#app{padding:16px clamp(10px,3vw,26px) 30px;flex:1}
h2{font:22px 'Fredoka One',sans-serif;color:#5B3A2E;margin:14px 0 8px}
h3{font:18px 'Fredoka One',sans-serif;margin:12px 0 6px}
.btn{font:18px 'Fredoka One',sans-serif;border:0;border-radius:14px;padding:12px 18px;color:#fff;background:var(--c);cursor:pointer;
  box-shadow:0 4px 0 rgba(0,0,0,.15);text-decoration:none;display:inline-block;text-align:center}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.15)}
.btn.ghost{background:#fff;color:#5B3A2E;border:2px solid #f1d5c9}
.btn.green{background:#22C55E}
.btn.big{font-size:21px;padding:14px 24px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;margin-top:12px}
.row.col{flex-direction:column;align-items:stretch}
.hint{font-size:14px;color:#7c5040;font-weight:700;margin-top:6px}
.hero{text-align:center;margin:6px 0 12px}
.title{font:clamp(28px,6vw,46px) 'Fredoka One',sans-serif;color:#FF6B6B;text-shadow:3px 3px 0 #fff,-2px -2px 0 #fff,3px 4px 8px #ffb3a0}
.sub{color:#7c5040;font-weight:800;font-size:clamp(14px,2.6vw,18px)}
.card{background:#fff;border-radius:16px;padding:14px 16px;box-shadow:0 3px 12px rgba(0,0,0,.06);border:2px solid #f5e6dc;margin:10px 0}
.lvl{text-align:center}.lvl b{font-family:'Fredoka One';color:#7c5040;margin-right:6px}
.chip{border:2px solid #e5e7eb;background:#fff;color:#6B7280;border-radius:999px;padding:8px 14px;font:800 15px Nunito,sans-serif;cursor:pointer;margin:3px}
.chip.on{background:var(--c);border-color:var(--c);color:#fff}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin:14px 0}
.tiles.extras{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.tile{border:0;border-radius:18px;padding:16px 12px;color:#fff;font:22px 'Fredoka One',sans-serif;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.13);text-align:center;transition:transform .12s}
.tile:hover{transform:translateY(-3px) scale(1.02)}
.tile .em{font-size:40px;display:block;margin-bottom:2px}
.tile small{display:block;font:800 13px Nunito,sans-serif;opacity:.95;margin-top:4px}
.extras .tile{font-size:18px}.extras .tile .em{font-size:32px}
.foot{text-align:center;margin-top:16px;color:#7c5040;font-weight:800;font-size:13px}
.foot p{margin-top:10px}
/* strategy list */
.scard{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;background:#fff;border-radius:16px;padding:12px 14px;margin:10px 0;border:2px solid #f5e6dc;box-shadow:0 3px 10px rgba(0,0,0,.05)}
.sem{font-size:38px;text-align:center}
.sname{font:20px 'Fredoka One',sans-serif;color:var(--c)}
.sshort{font-weight:700;color:#4B5563;font-size:15px;margin-top:2px}

/* learn */

/* practice */
.ptop{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:8px}
.prog{position:relative;flex:1;min-width:200px;height:24px;background:#E2E8F0;border-radius:999px;overflow:hidden}

/* vertical layout */

.po{color:#10B981}.pt{color:#3B82F6}.ph{color:#EF4444}
/* guided steps */
.gsteps,.solsteps{list-style:none;display:flex;flex-direction:column;gap:8px;margin:8px 0}

.gq{font:clamp(21px,4.4vw,30px) 'Fredoka One',sans-serif;color:#1f2937}
.gx{font-weight:800;color:#059669;font-size:14px;margin-top:2px}
.fill{color:#16A34A}
.final{font:clamp(20px,4vw,26px) 'Fredoka One',sans-serif;text-align:center;color:#16A34A;margin:10px 0}
.solh{font:17px 'Fredoka One',sans-serif;color:#7c5040;text-align:center;margin-top:6px}
/* keypad + feedback */
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:330px;margin:10px auto 0}
.key{height:clamp(52px,10vw,62px);border:0;border-radius:14px;background:#4ECDC4;color:#fff;font:28px 'Fredoka One',sans-serif;box-shadow:0 4px 0 #2a9d95;cursor:pointer}
.key:active{transform:translateY(2px);box-shadow:0 2px 0 #2a9d95}
.key.fn{background:#94A3B8;box-shadow:0 4px 0 #64748b}
.key.ok{grid-column:1/-1;background:#22C55E;box-shadow:0 4px 0 #15803d;font-size:24px}
.fb{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:10px 12px;border:2px solid #FFD93D;font-weight:800;font-size:16px;min-height:68px}
.fb.ok{border-color:#86EFAC;background:#F0FDF4;color:#166534}
.fb.bad{border-color:#FCA5A5;background:#FEF2F2;color:#991B1B}
.fb.info{color:#374151}
.fb .mascot{width:52px;height:60px;flex:none}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.cf{position:fixed;width:11px;height:11px;border-radius:3px;pointer-events:none;z-index:60;animation:cf 1s ease-out forwards}
@keyframes cf{to{transform:translate(var(--dx),var(--dy)) rotate(400deg);opacity:0}}
.toast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) scale(0);z-index:70;font:clamp(30px,7vw,52px) 'Fredoka One',sans-serif;color:#F59E0B;
  text-shadow:3px 3px 0 #fff,-3px -3px 0 #fff,3px -3px 0 #fff,-3px 3px 0 #fff;animation:toast 1.9s ease forwards;pointer-events:none;white-space:nowrap}
@keyframes toast{15%{transform:translate(-50%,-50%) scale(1.1)}25%,80%{transform:translate(-50%,-50%) scale(1)}100%{transform:translate(-50%,-50%) scale(0)}}
/* results */
.res{background:#fff;border-radius:12px;padding:10px 14px;margin:6px 0;border:2px solid #BBF7D0;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px;font:19px 'Fredoka One',sans-serif}
.res.no{border-color:#FED7AA}
.res details{flex-basis:100%;font-family:Nunito}.res summary{cursor:pointer;color:#EA580C;font-weight:900}
.bigscore{text-align:center;font:clamp(40px,9vw,64px) 'Fredoka One',sans-serif;color:var(--c)}
/* progress */
.pstats{text-align:center;font-weight:800;color:#7c5040}.pstats .big{font:48px 'Fredoka One',sans-serif;color:#F59E0B}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.badge{background:#F3F4F6;border-radius:14px;padding:10px;text-align:center;opacity:.6}
.badge.on{background:#FEF3C7;opacity:1;border:2px solid #FBBF24}
.bem{font-size:30px}.bn{font:15px 'Fredoka One',sans-serif}.bneed{font-size:12px;font-weight:800;color:#6B7280}
.prow{display:grid;grid-template-columns:minmax(150px,1.3fr) 2fr 60px auto;gap:8px;align-items:center;margin:5px 0;font-weight:800;font-size:14px}
.pbar{height:12px;background:#E5E7EB;border-radius:6px;overflow:hidden}.pbar i{display:block;height:100%}
.tg{font-size:12px;border-radius:999px;padding:2px 8px;white-space:nowrap}.tg.good{background:#DCFCE7;color:#166534}.tg.warn{background:#FFEDD5;color:#9A3412}
@media (max-width:620px){.prow{grid-template-columns:1fr 70px 50px}.prow .tg{grid-column:1/-1}}
.ttg{border-collapse:collapse;margin:6px auto;font-weight:900;font-size:13px}
.ttg td,.ttg th{width:30px;height:28px;text-align:center;border:2px solid #fff;border-radius:6px}
.ttg td{background:#E5E7EB;color:#9CA3AF}.ttg td.g{background:#86EFAC;color:#14532d}.ttg td.r{background:#FDBA74;color:#7c2d12}
.ttg th{color:#7c5040}
/* worksheet */
.ws{background:#fff;border-radius:12px;padding:18px;--cw:38px}
.ws h1{font:26px 'Fredoka One',sans-serif;color:#1f2937;text-align:center}
.wsmeta{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;margin:10px 0 14px;font-weight:800}
.wsgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px}
@media (max-width:560px){.wsgrid{grid-template-columns:1fr}}
.wsq{border:1.5px solid #e5e7eb;border-radius:10px;padding:10px;display:flex;gap:8px;break-inside:avoid}
.wsq.space{min-height:150px}
.wsn{font:18px 'Fredoka One',sans-serif;color:#9CA3AF}
.wsc{flex:1}
.wsl{font:22px 'Fredoka One',sans-serif}
.wss{font-weight:700;font-size:15px;margin-bottom:6px}
.blank{display:inline-block;min-width:80px;border-bottom:2px solid #334155;color:#DC2626;text-align:center}
.wst{font-size:12px;color:#9CA3AF;font-weight:800;margin-top:6px}
.keywrap{display:none}.ans-on .keywrap{display:block}
.keyl{margin-left:24px;line-height:1.6}.keyl small{display:block;color:#6B7280;font-weight:700}

</style>

<body>
<div id="shell">
  <header class="bar">
    <button class="back" data-act="back" id="backBtn" aria-label="Back">◀</button>
    <h1 id="title">Math Strategies</h1>
    <button class="icon" data-act="sound" id="sndBtn" aria-label="Sound">🔊</button>
    <div class="stars" id="starBox"></div>
  </header>
  <main id="app"></main>
</div>
<script>
/* =========================================================
   Math Strategies Adventure — Year 2 & 3
   Companion to the Montessori Math Adventure (Prep–Year 1).
   Plain HTML/JS, no libraries. Progress is saved in this browser.
   ========================================================= */

/* ---------- STATE ---------- */
const SAVE_KEY='mathStrategiesAdventure.y23.v1';
const defState=()=>({stars:0,streak:0,best:0,level:2,muted:false,guided:true,stats:{},tt:{},sets:0});
const S=defState();
try{Object.assign(S,JSON.parse(localStorage.getItem(SAVE_KEY)||'{}'));}catch(e){}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(S));}catch(e){}}

const LEVELS={1:'🌱 Year 2 review',2:'🌟 Year 3',3:'🔥 Year 3 challenge'};
const LEVEL_DESC={
  1:'Warm-up: 2-digit numbers to 100 and the ×2, ×5, ×10 facts.',
  2:'Core Year 3: regrouping with 2-digit numbers and the ×2, ×3, ×4, ×5, ×10 facts.',
  3:'Stretch: 3-digit numbers, all tables to ×10 (and ×12), and 2-digit × 1-digit.'};
const TABLES={1:[2,5,10],2:[2,3,4,5,10],3:[2,3,4,5,6,7,8,9,10]};
const MAXM={1:10,2:10,3:12};
const OPS={
  add:{name:'Addition',sym:'+',emoji:'➕',color:'#F59E0B'},
  sub:{name:'Subtraction',sym:'−',emoji:'➖',color:'#8B5CF6'},
  mul:{name:'Multiplication',sym:'×',emoji:'✖️',color:'#10B981'},
  div:{name:'Division',sym:'÷',emoji:'➗',color:'#3B82F6'}};
const PRAISE=['⭐ Amazing!','🎉 Brilliant!','👏 Well done!','🌟 Superstar!','🚀 Excellent!','💪 You rock!','🌈 Fantastic!'];
const STEP_PRAISE=['✓ Yes! Next step…','✓ Spot on!','✓ Great thinking!','✓ Correct — keep going!'];

/* ---------- AUDIO (same sounds as the little-learners game) ---------- */
let audioCtx=null;
function getCtx(){audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});return audioCtx;}
function tone(freq=660,dur=.12,type='sine',vol=.04,delay=0){
  if(S.muted)return;
  try{const ctx=getCtx(),o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=freq;
    g.gain.setValueAtTime(.001,ctx.currentTime+delay);g.gain.linearRampToValueAtTime(vol,ctx.currentTime+delay+.02);
    g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+delay+dur);o.connect(g);g.connect(ctx.destination);
    o.start(ctx.currentTime+delay);o.stop(ctx.currentTime+delay+dur+.05);}catch(e){}
}
function sound(k){
  if(k==='ok'){tone(523,.1,'triangle',.04,0);tone(659,.1,'triangle',.04,.08);tone(784,.18,'triangle',.05,.16);}
  if(k==='great')[523,659,784,1046].forEach((f,i)=>tone(f,.14,'triangle',.05,i*.09));
  if(k==='step'){tone(660,.08,'triangle',.04);tone(880,.1,'triangle',.04,.07);}
  if(k==='bad'){tone(220,.15,'sawtooth',.025);setTimeout(()=>tone(180,.12,'sawtooth',.02),120);}
  if(k==='tap')tone(440,.05,'sine',.02);
  if(k==='streak')[659,784,880,1046,1318].forEach((f,i)=>tone(f,.12,'triangle',.05,i*.07));
}

/* ---------- HELPERS ---------- */
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const H=n=>Math.floor(n/100)%10, T=n=>Math.floor(n/10)%10, O=n=>n%10;
const len=n=>String(n).length;
function tries(fn,ok,max=400){let v;for(let i=0;i<max;i++){v=fn();if(ok(v))return v;}return v;}
const fmtAns=a=>String(a);
const fmtTyped=s=>s.replace('r',' r ');
const qPlain=(q,a)=>q.includes('?')?q.replace('?',a):`${q} = ${a}`;
const qFill=(q,a)=>q.includes('?')?q.replace('?',`<b class="fill">${fmtAns(a)}</b>`):`${q} = <b class="fill">${fmtAns(a)}</b>`;
const qBox=(q,inner)=>{const b=`<span class="abox active">${inner||'&nbsp;'}</span>`;return q.includes('?')?q.replace('?',b):`${q} = ${b}`;};
function chain(st,d,n){const a=[st];for(let i=1;i<=n;i++)a.push(st+d*i);return a.join(' → ');}
function parts(n){const r=[];if(H(n))r.push({v:H(n)*100,p:'h'});if(T(n))r.push({v:T(n)*10,p:'t'});if(O(n))r.push({v:O(n),p:'o'});return r;}
function isRight(typed,ans){
  if(typed==='')return false;
  if(typeof ans==='string'){const n=s=>String(s).toLowerCase().replace(/\s+/g,'').replace(/^0+(?=\d)/,'').replace(/r0+(?=\d)/,'r');return n(typed)===n(ans);}

function P(op,x,y,ans,steps,vis,extra={}){return Object.assign({op,x,y,ans,text:`${x} ${OPS[op].sym} ${y}`,steps,vis},extra);}

/* ---------- NUMBER PICKERS (by level) ---------- */
function pickAdd(L){

    if(L===1){a=rnd(12,68);b=rnd(11,30);} else if(L===2){a=rnd(25,89);b=rnd(14,69);} else {a=rnd(105,699);b=rnd(25,299);}
    return [a,b];},
  ([a,b])=>(L===1?a+b<=99:L===2?a+b<=160:a+b<=999)&&(L===1||Math.random()<.25||O(a)+O(b)>=10)&&O(a)+O(b)>0);
}
function pickSub(L){
  return tries(()=>{let a,b;
    if(L===1){a=rnd(25,99);b=rnd(11,a-6);} else if(L===2){a=rnd(41,99);b=rnd(12,a-6);} else {a=rnd(210,999);b=rnd(105,a-30);}
    return [a,b];},
  ([a,b])=>L===1||Math.random()<.25||O(a)<O(b));
}
const roundUp=b=>b%100>=98?Math.ceil(b/100)*100:Math.ceil(b/10)*10;

const svgOpen=(W,H)=>`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
const PF={h:['#FEE2E2','#EF4444'],t:['#DBEAFE','#3B82F6'],o:['#D1FAE5','#10B981'],x:['#FEF3C7','#D97706']};

// Empty number line. jumps: [{from,to,label,sub,step}] — only jumps with step<k are drawn.
function numberLine(jumps,k=99){
  const vals=[...new Set(jumps.flatMap(j=>[j.from,j.to]))].sort((a,b)=>a-b);
  const pos={};let x=0;vals.forEach((v,i)=>{if(i)x+=34+16*Math.log2(v-vals[i-1]+1);pos[v]=x;});
  const W=680,pad=44,base=128,sc=(W-2*pad)/(x||1),Px=v=>pad+pos[v]*sc;
  const shown=jumps.filter(j=>j.step<k), all=shown.length===jumps.length;
  let s=svgOpen(W,172)+`<defs>
    <marker id="nlF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10B981"/></marker>
    <marker id="nlB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#EF4444"/></marker></defs>`;
  s+=`<line x1="${pad-28}" y1="${base}" x2="${W-pad+28}" y2="${base}" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>`;
  shown.forEach(j=>{const x1=Px(j.from),x2=Px(j.to),w=Math.abs(x2-x1),h=Math.min(80,14+w*.45),mx=(x1+x2)/2,fwd=j.to>j.from,col=fwd?'#10B981':'#EF4444';
    s+=`<path d="M${x1} ${base-4} Q${mx} ${base-4-2*h} ${x2} ${base-4}" fill="none" stroke="${col}" stroke-width="3" marker-end="url(#${fwd?'nlF':'nlB'})"/>`;
    s+=`<text x="${mx}" y="${base-10-h}" text-anchor="middle" class="nlj" fill="${col}">${j.label}</text>`;
    if(j.sub)s+=`<text x="${mx}" y="${base+8-h}" text-anchor="middle" class="nls">${j.sub}</text>`;});
  const start=jumps[0].from,end=jumps[jumps.length-1].to,pts=new Set([start]);shown.forEach(j=>pts.add(j.to));
  pts.forEach(v=>{const px=Px(v),isS=v===start,isE=all&&v===end;
    s+=`<circle cx="${px}" cy="${base}" r="${isS||isE?7:5}" fill="${isS?'#3B82F6':isE?'#F59E0B':'#334155'}"/>`;
    s+=`<text x="${px}" y="${base+28}" text-anchor="middle" class="nlv${isS||isE?' b':''}">${v}</text>`;});
  return s+'</svg>';
}
// Split (partition) tree: groups [{top, parts:[{v,p}]}]
function splitTree(groups,sym){
  const W=680,cxs=groups.length===2?[190,490]:[340];let s=svgOpen(W,148);
  groups.forEach((g,gi)=>{const cx=cxs[gi];
    s+=`<text x="${cx}" y="42" text-anchor="middle" class="stTop">${g.top}</text>`;
    const m=g.parts.length;g.parts.forEach((p,pi)=>{const px=cx+(pi-(m-1)/2)*96,py=112,[f,st]=PF[p.p];
      s+=`<line x1="${cx}" y1="54" x2="${px}" y2="${py-20}" stroke="#CBD5E1" stroke-width="3"/>`;
      s+=`<rect x="${px-42}" y="${py-20}" width="84" height="40" rx="12" fill="${f}" stroke="${st}" stroke-width="2"/>`;
      s+=`<text x="${px}" y="${py+8}" text-anchor="middle" class="stPart" fill="${st}">${p.v}</text>`;});});
  if(groups.length===2)s+=`<text x="340" y="44" text-anchor="middle" class="stSym">${sym}</text>`;
  return s+'</svg>';
}
function groupsVis(m,t){

function shareVis(n,d,k){

function areaVis(a,m,k){
  const tv=a-a%10,ov=a%10,W=680,x0=80,total=540;let wT=Math.round(total*tv/a),wO=total-wT;if(wO<140){wO=140;wT=total-140;}
  const y0=40,h=110;let s=svgOpen(W,y0+h+(k>2?52:16));

  s+=`<rect x="${x0+wT}" y="${y0}" width="${wO}" height="${h}" fill="#D1FAE5" stroke="#10B981" stroke-width="3"/>`;

  s+=`<text x="${x0-14}" y="${y0+h/2+8}" text-anchor="end" class="stPart" fill="#EF4444">${m}</text>`;
  s+=`<text x="${x0+wT/2}" y="${y0+h/2+7}" text-anchor="middle" class="arT">${tv} × ${m}${k>0?` = ${tv*m}`:''}</text>`;

function eqVis(lines,k,base=1){return `<div class="eqvis">${lines.map((l,i)=>i<base+k?`<div class="eql${i===0?' first':''}">${l}</div>`:'').join('')}</div>`;}

/* ---------- VERTICAL (COLUMN) METHOD ---------- */
const PLACE=['ones','tens','hundreds','thousands'],PCLS=['po','pt','ph','ph'];
function digitsR(num,n){const s=String(num),r=[];for(let i=0;i<n;i++){const j=s.length-1-i;r.push(j>=0?+s[j]:null);}return r;}
function vertAdd(a,b){
  const ans=a+b,real=Math.max(len(a),len(b)),n=Math.max(real,len(ans));
  const A=digitsR(a,n),B=digitsR(b,n),carries=new Array(n+1).fill(0),steps=[],ansStep=[];let c=0;
  for(let i=0;i<real;i++){const x=A[i]||0,y=B[i]||0,s=x+y+c,last=i===real-1;carries[i]=c;
    steps.push({hint:`Add the ${PLACE[i]} column${c?' — remember the carried 1!':''}`,q:c?`${x} + ${y} + ${c}`:`${x} + ${y}`,a:s,
      explain:s>=10&&!last?`${s} → write ${s%10}, carry 1 to the ${PLACE[i+1]}`:`write ${s}`});c=s>=10?1:0;}
  for(let i=0;i<n;i++)ansStep[i]=Math.min(i,real-1);
  return {type:'add',sym:'+',a,b,ans,n,A,B,carries,steps,ansStep,ansD:digitsR(ans,n)};
}
function vertSub(a,b){
  const ans=a-b,n=Math.max(len(a),len(b)),A=digitsR(a,n),B=digitsR(b,n),newTop=new Array(n).fill(null),revealAt=new Array(n).fill(0),steps=[],ansStep=[];
  let borrow=0;
  for(let i=0;i<n;i++){const orig=A[i]||0,y=B[i]||0;let t=orig-borrow;const lent=borrow>0;let traded=false;
    if(t<y){t+=10;traded=true;borrow=1;}else borrow=0;
    if(lent||traded){newTop[i]=t;revealAt[i]=lent?i-1:i;}
    steps.push({hint:traded?`Not enough ${PLACE[i]} to take away ${y}. Trade 1 from the ${PLACE[i+1]} — so ${orig-(lent?1:0)} becomes ${t}`:(lent?`The ${PLACE[i]} gave one away, so ${orig} is now ${t}. Subtract`:`Subtract the ${PLACE[i]} column`),
      q:`${t} − ${y}`,a:t-y,explain:`write ${t-y}`});ansStep[i]=i;}
  return {type:'sub',sym:'−',a,b,ans,n,A,B,newTop,revealAt,steps,ansStep,ansD:digitsR(ans,n)};
}
function vertMul(a,m){
  const ans=a*m,n=Math.max(len(a),len(ans)),A=digitsR(a,n),B=digitsR(m,n),carries=new Array(n+1).fill(0),steps=[],ansStep=[];
  const x0=A[0],s0=x0*m,c=Math.floor(s0/10);
  steps.push({hint:`Multiply the ones: ${x0} × ${m}`,q:`${x0} × ${m}`,a:s0,explain:s0>=10?`${s0} → write ${s0%10}, carry ${c} to the tens`:`write ${s0}`});
  carries[1]=c;const x1=A[1],s1=x1*m+c;
  steps.push({hint:`Multiply the tens: ${x1} × ${m}${c?`, then add the carried ${c}`:''}`,q:c?`${x1} × ${m} + ${c}`:`${x1} × ${m}`,a:s1,explain:`write ${s1}`});
  for(let i=0;i<n;i++)ansStep[i]=Math.min(i,1);
  return {type:'mul',sym:'×',a,b:m,ans,n,A,B,carries,steps,ansStep,ansD:digitsR(ans,n)};
}
// k = number of steps revealed; inter = {typed, carry} for "on my own" mode
function vertHTML(v,k=99,inter=null){
  const n=v.n;let h=`<div class="vert" style="grid-template-columns:repeat(${n+1},var(--cw))"><div class="vc"></div>`;
  for(let i=n-1;i>=0;i--){let t='',attr='',cls='vc';
    if(v.type==='sub'){if(!inter&&v.newTop[i]!==null&&k>v.revealAt[i])t=v.newTop[i];}
    else if(inter){if(i>0){attr=` data-carry="${i}"`;cls+=' tap';t=inter.carry[i]||'';}}
    else if(v.carries[i]&&k>=i)t=v.carries[i];
    h+=`<div class="${cls}"${attr}>${t}</div>`;}
  h+='<div class="vd"></div>';
  for(let i=n-1;i>=0;i--){const crossed=v.type==='sub'&&!inter&&v.newTop[i]!==null&&k>v.revealAt[i];h+=`<div class="vd ${PCLS[i]}${crossed?' cross':''}">${v.A[i]??''}</div>`;}
  h+=`<div class="vd sign">${v.sym}</div>`;
  for(let i=n-1;i>=0;i--)h+=`<div class="vd ${PCLS[i]}">${v.B[i]??''}</div>`;
  h+='<div class="vline"></div><div class="vd"></div>';
  for(let i=n-1;i>=0;i--){
    if(inter){const s=inter.typed,ch=i<s.length?s[s.length-1-i]:'';h+=`<div class="vbox ${PCLS[i]}${i===s.length?' active':''}">${ch}</div>`;}
    else{const d=v.ansD[i],show=d!==null&&k>v.ansStep[i];h+=`<div class="vd ${PCLS[i]}">${show?d:''}</div>`;}}
  return h+'</div>';
}

/* ---------- STRATEGIES ---------- */
function jumpSteps(op,a,b){
  const sg=op==='add'?1:-1,sy=op==='add'?'+':'−',steps=[],jumps=[];let cur=a;
  [[H(b)*100,100,'hundred'],[T(b)*10,10,'ten'],[O(b),1,'one']].forEach(([v,unit,word])=>{
    if(!v)return;const cnt=v/unit,st=steps.length;
    if(unit>1&&cnt<=6){for(let i=0;i<cnt;i++)jumps.push({from:cur+sg*unit*i,to:cur+sg*unit*(i+1),label:`${sy}${unit}`,step:st});}
    else jumps.push({from:cur,to:cur+sg*v,label:`${sy}${v}`,step:st});
    const nxt=cur+sg*v;
    steps.push({hint:`Jump ${op==='add'?'forward':'back'} ${cnt} ${word}${cnt>1?'s':''} from ${cur}`,q:`${cur} ${sy} ${v}`,a:nxt,explain:unit>1&&cnt<=6?chain(cur,sg*unit,cnt):`${cur} → ${nxt}`});
    cur=nxt;});
  return P(op,a,b,cur,steps,k=>numberLine(jumps,k));
}

/* ---------- STORY PROBLEMS ---------- */

  const n1=pick(NAMES);let n2=pick(NAMES);while(n2===n1)n2=pick(NAMES);const th=pick(THINGS),{x,y}=p;
  switch(p.op){
    case 'add':return pick([`${n1} has ${x} ${th}. ${n2} gives ${n1} ${y} more. How many ${th} does ${n1} have now?`,`There are ${x} ${th} in one box and ${y} in another box. How many ${th} are there altogether?`,`${n1} read ${x} pages on Monday and ${y} pages on Tuesday. How many pages is that in total?`]);
    case 'sub':return pick([`${n1} had ${x} ${th} and gave ${y} to ${n2}. How many ${th} are left?`,`A shop had ${x} ${th}. It sold ${y}. How many are left?`,`${n1} has ${x} ${th}. ${n2} has ${y}. How many more does ${n1} have?`]);
    case 'mul':return pick([`There are ${x} bags with ${y} ${th} in each bag. How many ${th} altogether?`,`${n1} makes ${x} rows with ${y} ${th} in each row. How many ${th} is that?`,`${x} friends each have ${y} ${th}. How many ${th} do they have altogether?`]);
    case 'div':return p.rem?`${x} ${th} are shared equally between ${y} friends. How many does each friend get, and how many are left over? (Write it like 5 r 2.)`
      :pick([`${x} ${th} are shared equally between ${y} friends. How many does each friend get?`,`${n1} packs ${x} ${th} into bags of ${y}. How many bags does ${n1} need?`]);

    const ang=Math.random()*Math.PI*2,d=80+Math.random()*180;e.style.setProperty('--dx',Math.cos(ang)*d+'px');e.style.setProperty('--dy',Math.sin(ang)*d-70+'px');

let SES=null,Q=null;
function startSession(cfg,replace=false){

function nextQuestion(){
  const p=SES.gen();if(SES.story){p.story=story(p);delete p.vertical;}
  const g=p.steps.slice();const last=g[g.length-1];
  if(String(last.a)!==String(p.ans))g.push({hint:`Now finish it: what is ${p.text}?`,q:p.text,a:p.ans});
  Q={p,gsteps:g,typed:'',wrongs:0,step:0,sw:0,perfect:true,done:false,revealed:false,carry:{},guided:SES.allowGuided&&S.guided,fb:null,showSentence:false};
}
function practice(){
  if(SES.finished)return summary();
  const p=Q.p,s=p.strat;bar(SES.title,SES.color);
  const tgt=Q.guided&&!Q.done?Q.gsteps[Q.step].a:p.ans,showR=typeof tgt==='string';
  const hideSentence=p.story&&!Q.done&&!Q.guided&&!Q.showSentence;
  let main=p.story?`<div class="story">📖 ${p.story}</div>`:'';
  const inlineBox=!Q.done&&!Q.guided&&!p.vertical;
  const ansPart=Q.done?`<span class="good">${fmtAns(p.ans)}</span>`:inlineBox?`<span class="abox active">${fmtTyped(Q.typed)||'&nbsp;'}</span>`:'<span class="qm">?</span>';
  if(hideSentence)main+=`<div class="problem small">Answer: ${ansPart}</div><div class="row"><button class="btn ghost" data-act="sentence">🤔 Show me the number sentence</button></div>`;
  else main+=`<div class="problem">${p.text} = ${ansPart}</div>`;
  if(Q.done){
    if(Q.revealed)main+=solutionHTML(p);
    else if(Q.guided)main+=visHTML(p,99)+guidedHTML()+finalLine(p);
    else if(p.vertical)main+=`<div class="vis">${vertHTML(p.vertical,99)}</div>`;
  }else if(Q.guided)main+=visHTML(p,Q.step)+guidedHTML();
  else{
    if(p.showVis0)main+=visHTML(p,0);
    if(p.vertical)main+=`<div class="vis"><div class="vtip">Type the ones first — digits fill in from right to left.${p.op!=='sub'?' Tap the dotted boxes to write carries.':''}</div>${vertHTML(p.vertical,0,{typed:Q.typed,carry:Q.carry})}</div>`;
  }
  const fb=`<div class="fb ${Q.fb?Q.fb.t:'info'}">${MASCOT}<span>${Q.fb?Q.fb.m:(Q.guided?'Answer one step at a time. You can do it!':'Work it out, then type your answer.')}</span></div>`;
  let ctr;
  if(!Q.done)ctr=keypadHTML(showR)+`<div class="row">${!Q.guided&&SES.allowGuided?'<button class="btn ghost" data-act="help">💡 Help me step by step</button>':'<button class="btn ghost" data-act="giveup">👀 Show me the answer</button>'}</div>`;
  else ctr=`<div class="row col"><button class="btn green big" data-act="next">${SES.i+1>=SES.total?'🏁 See my results':'Next question ▶'}</button>${!Q.guided&&!Q.revealed?`<button class="btn ghost" data-act="see">👀 See how the ${s.name.toLowerCase()} works</button>`:''}</div>`;
  const toggle=SES.allowGuided?`<div class="seg"><button data-act="mode" data-v="1" class="${S.guided?'on':''}">🧭 Step by step</button><button data-act="mode" data-v="0" class="${!S.guided?'on':''}">💪 On my own</button></div>`:'';
  $app.innerHTML=`<div class="ptop"><div class="prog"><div style="width:${SES.i/SES.total*100}%"></div><span>Question ${SES.i+1} of ${SES.total}</span></div>${toggle}</div>
    <div class="play"><div class="mainc">${hideSentence?'':`<div class="stag">${s.emoji} ${s.name}</div>`}${main}</div><div class="side">${fb}${ctr}</div></div>`;
}
function guidedHTML(){
  return `<ol class="gsteps">${Q.gsteps.map((st,i)=>{
    if(i<Q.step||Q.done)return `<li class="done"><div class="gq">${qFill(st.q,st.a)} ✓</div>${st.explain?`<div class="gx">${st.explain}</div>`:''}</li>`;
    if(i===Q.step)return `<li class="cur"><div class="gh">Step ${i+1}: ${st.hint}</div><div class="gq">${qBox(st.q,fmtTyped(Q.typed))}</div></li>`;
    return `<li class="todo">Step ${i+1}</li>`;}).join('')}</ol>`;
}
function keypadHTML(showR){
  return `<div class="keypad">${['7','8','9','4','5','6','1','2','3'].map(k=>`<button class="key" data-key="${k}">${k}</button>`).join('')}
    <button class="key fn" data-key="back" aria-label="Delete">⌫</button><button class="key" data-key="0">0</button>${showR?'<button class="key fn" data-key="r">r</button>':'<button class="key fn" data-key="clear">C</button>'}
    <button class="key ok" data-key="ok">✓ Check</button></div>`;
}
function press(k){
  if(!Q||Q.done||SES.finished)return;
  const vert=!Q.guided&&Q.p.vertical;
  if(k==='ok')return check();
  if(k==='back')Q.typed=vert?Q.typed.slice(1):Q.typed.slice(0,-1);
  else if(k==='clear')Q.typed='';
  else if(k==='r'){if(Q.typed&&!Q.typed.includes('r'))Q.typed+='r';}
  else{const max=vert?Q.p.vertical.n:7;if(Q.typed.length<max)Q.typed=vert?k+Q.typed:Q.typed+k;}
  sound('tap');draw();
}
function breakStreak(){if(Q.perfect){Q.perfect=false;S.streak=0;save();updateBar();}}
function check(){
  if(!Q||Q.done||Q.typed==='')return;
  if(Q.guided){
    const st=Q.gsteps[Q.step];
    if(isRight(Q.typed,st.a)){Q.step++;Q.typed='';Q.sw=0;if(Q.step>=Q.gsteps.length)finishQ(true);else{sound('step');Q.fb={t:'ok',m:pick(STEP_PRAISE)};}}
    else{Q.sw++;breakStreak();sound('bad');Q.typed='';
      if(Q.sw>=2){Q.fb={t:'bad',m:`That step is <b>${qPlain(st.q,fmtAns(st.a))}</b>. Let's keep going!`};Q.step++;Q.sw=0;if(Q.step>=Q.gsteps.length)finishQ(true);}
      else Q.fb={t:'bad',m:'Not quite — check that step again! 💪'};}
  }else{
    if(isRight(Q.typed,Q.p.ans))finishQ(true);
    else{Q.wrongs++;breakStreak();sound('bad');Q.typed='';
      if(Q.wrongs>=2){Q.revealed=true;finishQ(false);}
      else Q.fb={t:'bad',m:`Not quite! Have another go. 💡 Hint: ${Q.p.steps[0].hint}.`};}
  }
  draw();
  if(Q.fb&&Q.fb.t==='bad')document.querySelector('.fb')?.classList.add('shake');
}
function finishQ(correct){
  Q.done=true;const p=Q.p;
  stat(p.key,Q.perfect);if(p.story)stat('story',Q.perfect);
  if(p.tt){const o=S.tt[p.tt]||{r:0,t:0};o.t++;if(Q.perfect)o.r++;S.tt[p.tt]=o;}
  SES.results.push({p,perfect:Q.perfect});
  if(correct){S.stars++;if(Q.perfect){S.streak++;S.best=Math.max(S.best,S.streak);}
    sound(Q.perfect?'great':'ok');confetti();Q.fb={t:'ok',m:`${pick(PRAISE)} <b>${p.text} = ${fmtAns(p.ans)}</b>`};
    const n=S.streak;if(Q.perfect&&[5,10,20,50,100].includes(n))setTimeout(()=>{toast(`🔥 ${n} in a row!`);sound('streak');confetti(40);},500);}
  else Q.fb={t:'info',m:`The answer is <b>${fmtAns(p.ans)}</b>. Have a look at how it works 👇`};
  save();updateBar();
}

  {em:'⚡',name:'Table Master',need:'50 table facts',ok:()=>((S.stats.tt||{}).r||0)>=50},
  {em:'📖',name:'Story Solver',need:'10 story problems',ok:()=>((S.stats.story||{}).r||0)>=10},
  {em:'🏆',name:'Star Collector',need:'100 stars',ok:()=>S.stars>=100}];
function progress(){
  const P=CUR.params;bar('🏆 My Progress','#22C55E');
  const rows=Object.entries(OPS).map(([op,o])=>`<h3 style="color:${o.color}">${o.emoji} ${o.name}</h3>`+STRATS.filter(s=>s.op===op).map(s=>{const st=S.stats[s.key]||{r:0,t:0},acc=st.t?st.r/st.t:0;
    const tag=st.t>=5?(acc>=.9?'<span class="tg good">🌟 Mastered</span>':acc<.7?'<span class="tg warn">💪 Needs practice</span>':''):'';
    return `<div class="prow"><span>${s.emoji} ${s.name}</span><span class="pbar"><i style="width:${acc*100}%;background:${o.color}"></i></span><span>${st.t?`${st.r}/${st.t}`:'—'}</span>${tag}</div>`;}).join('')).join('');
  $app.innerHTML=`<div class="pstats"><div class="big">⭐ ${S.stars}</div>Best streak 🔥 ${S.best} · Practice sets finished ${S.sets}</div>
    <h2>Badges</h2><div class="badges">${BADGES.map(b=>{const ok=b.ok();return `<div class="badge ${ok?'on':''}"><div class="bem">${b.em}</div><div class="bn">${b.name}</div><div class="bneed">${ok?'Earned! 🎉':b.need}</div></div>`;}).join('')}</div>
    <div class="card"><h2>Parents' corner: strategies</h2><p class="hint">Perfect answers (no mistakes) out of questions tried. Strategies marked 💪 are worth more practice.</p>${rows}</div>
    <div class="card"><h2>Times-table map</h2>${ttGrid()}</div>
    <div class="row"><button class="btn ghost" data-act="reset">${P.confirm?'⚠️ Tap again to erase all progress':'↺ Reset progress'}</button></div>`;
}

/* ---------- EVENTS ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act],[data-key],[data-carry]');if(!el)return;
  const d=el.dataset;
  if(d.key)return press(d.key);
  if(d.carry!==undefined){const v=Q.carry[d.carry]||'';Q.carry[d.carry]=v===''?'1':v==='1'?'2':'';sound('tap');return draw();}
  const P=CUR.params,val=v=>isNaN(v)?v:+v;
  switch(d.act){
    case 'back':back();break;
    case 'sound':S.muted=!S.muted;save();updateBar();sound('tap');break;
    case 'level':S.level=+d.v;save();sound('tap');draw();break;
    case 'op':go('op',{op:d.op});break;
    case 'go':go(d.to==='story'?'mixed':d.to,d.to==='story'?{storyOnly:true}:{});break;
    case 'learn':go('learn',{key:d.k});break;
    case 'prac':startStrat(d.k);break;
    case 'opmix':startSession({title:`🎯 Mixed ${OPS[d.op].name}`,color:OPS[d.op].color,total:10,allowGuided:true,gen:()=>makeProblem(pick(poolFor([d.op])).key)});break;
    case 'wsop':go('ws',{op:d.op});break;
    case 'lnext':P.k++;draw();break;
    case 'lall':P.k=P.p.steps.length;draw();break;
    case 'lnew':P.p=null;draw();break;
    case 'lprac':startStrat(P.key);break;
    case 'mode':S.guided=d.v==='1';save();if(Q&&!Q.done){Q.guided=S.guided;Q.step=0;Q.typed='';Q.fb=null;}draw();break;
    case 'help':Q.guided=true;Q.step=0;Q.typed='';Q.fb={t:'info',m:"Let's do it together, one step at a time! 🧭"};draw();break;
    case 'giveup':breakStreak();Q.revealed=true;finishQ(false);draw();break;
    case 'see':Q.revealed=true;draw();break;
    case 'sentence':Q.showSentence=true;draw();break;
    case 'next':nextBtn();break;
    case 'again':startSession(SES.cfg,true);break;
    case 'tog':{const arr=P[d.g],v=val(d.v),i=arr.indexOf(v);if(i>=0){if(arr.length>1)arr.splice(i,1);}else arr.push(v);sound('tap');draw();break;}
    case 'set':P[d.g]=val(d.v);if(d.g==='op')P.strat='any';sound('tap');draw();break;
    case 'flip':P[d.g]=!P[d.g];sound('tap');draw();break;
    case 'start-mixed':{const ops=P.ops.slice(),so=P.storyOnly;startSession({title:so?'📖 Story Problems':'🎲 Mixed Quiz',color:so?'#F97316':'#EC4899',total:P.n,allowGuided:true,story:so||P.story,gen:()=>makeProblem(pick(poolFor(ops)).key)});break;}
    case 'start-tt':{const tabs=P.tabs.slice(),dv=P.div;startSession({title:'⚡ Times Tables',color:'#14B8A6',total:P.n,allowGuided:false,gen:()=>ttProblem(tabs,dv)});break;}
    case 'ws-gen':{const cfg={op:P.op,strat:P.strat,n:P.n,story:P.story,space:P.space};go('sheet',{cfg,items:genSheetItems(cfg),ans:false});break;}
    case 'ws-new':P.items=genSheetItems(P.cfg);draw();break;
    case 'ws-ans':P.ans=!P.ans;draw();break;
    case 'ws-print':window.print();break;
    case 'reset':if(P.confirm){const f=defState();Object.keys(S).forEach(k=>delete S[k]);Object.assign(S,f);save();P.confirm=false;}else P.confirm=true;draw();break;
  }
});
document.addEventListener('keydown',e=>{
  if(CUR.screen!=='practice'||!Q||SES.finished)return;
  if(Q.done){if(e.key==='Enter'){e.preventDefault();nextBtn();}return;}
  if(/^[0-9]$/.test(e.key))press(e.key);
  else if(e.key==='Backspace'){e.preventDefault();press('back');}
  else if(e.key==='Enter'){e.preventDefault();press('ok');}
  else if(e.key.toLowerCase()==='r')press('r');
});
draw();
</script>
</body>
